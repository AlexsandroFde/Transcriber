<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Transcritor</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>
  // Aplica o tema antes da primeira pintura (evita o "clarão" no tema escuro).
  (function () {
    var tema = "sistema";
    try { tema = localStorage.getItem("transcritor.tema") || "sistema"; } catch (e) {}
    var escuro = tema === "escuro" ||
      (tema === "sistema" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-tema", escuro ? "escuro" : "claro");
  })();
</script>
<link rel="stylesheet" href="/estilos/app.css">
<script type="module" src="/js/app.js"></script>
</head>
<body>
<div id="app"><div class="carregando-inicial" role="status"><div class="giro" aria-hidden="true"></div><span class="visualmente-oculto">Carregando o Transcritor</span></div></div>
<noscript><p style="padding:24px">O Transcritor precisa de JavaScript habilitado para funcionar.</p></noscript>
</body>
</html>
