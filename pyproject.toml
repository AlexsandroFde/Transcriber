[project]
name = "transcritor"
version = "1.0.0"
description = "Transcrição fiel de reuniões gravadas em vídeo (português brasileiro), com identificação de participantes, marcação temporal e exportação em MD, TXT, DOCX, SRT, VTT e JSON."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper>=1.2.1",
    "ctranslate2>=4.8.5",
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "pyannote.audio>=4.0.7",
    "sherpa-onnx>=2.0.1",
    "python-docx>=1.2.0",
    "imageio-ffmpeg>=0.8.1",
    "soundfile>=0.13",
    "numpy>=2.0",
    "scipy>=1.13",
]

[project.scripts]
transcritor = "transcritor.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "edge-tts>=7.0",
    "jiwer>=3.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcritor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
